name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kestrel
          POSTGRES_PASSWORD: kestrel
          POSTGRES_DB: kestrel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kestrel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy core config data strategies research portfolio risk execution backtest live observability cli.py

      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        env:
          KESTREL_POSTGRES_DSN: postgresql+psycopg://kestrel:kestrel@localhost:5432/kestrel

      - name: Test (pytest, excludes integration tests)
        run: uv run pytest --cov --cov-report=term-missing

  # Frontend build (web/, Phase 6) and image push to GHCR (Phase 5/10)
  # are added once those parts of the repo exist.

  image:
    # Build the engine image on every push/PR (catches Dockerfile breakage);
    # push to GHCR only from main. Deploy pulls ghcr.io/<repo>:<sha>.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    # Dashboard type-check + production build (same Node as the Dockerfile's web stage).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
