name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kestrel
          POSTGRES_PASSWORD: kestrel
          POSTGRES_DB: kestrel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kestrel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy core config data cli.py

      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        env:
          KESTREL_POSTGRES_DSN: postgresql+psycopg://kestrel:kestrel@localhost:5432/kestrel

      - name: Test (pytest, excludes integration tests)
        run: uv run pytest --cov --cov-report=term-missing

  # Frontend build (web/, Phase 6) and image push to GHCR (Phase 5/10)
  # are added once those parts of the repo exist.
