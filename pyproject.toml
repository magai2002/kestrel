[project]
name = "kestrel"
version = "0.1.0"
description = "Multi-market systematic trading bot (crypto + US ETFs), built as a teaching project."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "httpx>=0.27",
    "ccxt>=4.4",
    "alpaca-py>=0.33",
    "typer>=0.13",
    "structlog>=24.4",
    "pandas-market-calendars>=4.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.scripts]
kestrel = "cli:app"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "pre-commit>=4.0",
    "respx>=0.21",
    "time-machine>=2.16",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Repo layout (SPEC.md Section 4.2) puts packages at the repo root, not
# under src/ or a wrapping kestrel/ package.
include = [
    "core",
    "config",
    "data",
    "cli.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # formatter handles line length; don't double up with the linter

[tool.ruff.lint.isort]
known-first-party = ["core", "config", "data", "strategies", "portfolio", "risk", "execution", "backtest", "research", "live", "api", "observability"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Design rules (SPEC.md Section 4.3) single out these layers for strict
# typing because money and risk logic live there. Everything else is
# still typed, just not under every strict flag yet.
module = ["core.*", "execution.*", "risk.*"]
strict = true

[[tool.mypy.overrides]]
# Untyped third-party libraries without stubs.
module = ["ccxt.*", "pandas_market_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real network calls to a live venue (Binance Spot Testnet, Alpaca paper); opt-in via -m integration",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["core", "config", "data"]
