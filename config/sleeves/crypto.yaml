# Crypto sleeve (SPEC.md Section 3.1). See config/sleeve.py for the
# research/live/sandbox listing model.
#
# Universe: BTC and ETH are required. Add others only once they're
# confirmed available on BOTH the Binance Spot Testnet and Kraken.
name: crypto
asset_class: crypto
decision_bar: 4h
base_currency: USD # USDT is treated as USD; see docs/api-notes.md
paper_capital: 10000
periods_per_year_days: 365 # crypto trades every calendar day
buffer_pct: 0.10
bar_close_delay_seconds: 30
regime_benchmark: BTC

assets:
  - id: BTC
    # Binance's public bulk dumps: the only free source back to 2019.
    research: { venue: binance, symbol: BTCUSDT, base_currency: BTC, quote_currency: USDT }
    # Kraken: sim prices + the live venue (MiCA-licensed; Section 3.3).
    # Dash, not slash: Parquet partition dirs can't contain "/".
    # Kraken's OHLC endpoint only returns the last 720 bars (~120 days at
    # 4h) -- too short to warm up a 256-day EWMA -- so older history is
    # backfilled from Binance's (BTCUSDT ~ BTC-USD); Kraken's own bars win
    # wherever both exist.
    live: { venue: kraken, symbol: BTC-USD, base_currency: BTC, quote_currency: USD, backfill_venue: binance, backfill_symbol: BTCUSDT }
    # Binance Spot Testnet: plumbing only, synthetic prices.
    sandbox: { venue: binance_testnet, symbol: BTCUSDT, base_currency: BTC, quote_currency: USDT, backfill_venue: binance, backfill_symbol: BTCUSDT }
    costs:
      fee_pct: "0.0080" # Kraken entry-tier taker, verified Phase 2 (docs/api-notes.md)
      spread_bps: "2"
      slippage_k: "0.1"
  - id: ETH
    research: { venue: binance, symbol: ETHUSDT, base_currency: ETH, quote_currency: USDT }
    live: { venue: kraken, symbol: ETH-USD, base_currency: ETH, quote_currency: USD, backfill_venue: binance, backfill_symbol: ETHUSDT }
    sandbox: { venue: binance_testnet, symbol: ETHUSDT, base_currency: ETH, quote_currency: USDT, backfill_venue: binance, backfill_symbol: ETHUSDT }
    costs:
      fee_pct: "0.0080"
      spread_bps: "3"
      slippage_k: "0.1"

risk:
  per_instrument_weight_cap: 0.60
  max_order_notional_pct: 0.30
  price_band_pct: 0.02
  daily_loss_limit_pct: 0.03 # spec default; see docs/progress.md Phase 2 note on how often this trips
  drawdown_limit_pct: 0.20

strategies:
  - name: trend_vol_target
    weight: 1.0

# Live path (sandbox = Binance testnet, live = Kraken): marketable
# limits 0.2% through the last price (inside the 2% band), 60 s to fill,
# then up to two re-quotes.
execution:
  protection_bps: "20"
  timeout_seconds: 60
  max_requotes: 2

# Phase 7 go-live gates (spec Section 13; live/gates.py; docs/runbook.md).
# Everything here defaults to LOCKED. `kestrel live-check` shows the status.
live_gates:
  i_understand_this_uses_real_money: false
  max_live_capital: null # e.g. "1000" -- the ledger is seeded with this, sizing never exceeds it
  daily_loss_limit_abs: null # e.g. "30" (USD) -- required, in addition to the % limit
  min_sim_weeks: 8
  max_tracking_gap_pct: 2.0
  min_dsr: 0.95
  keys_trade_only_confirmed: false
  emergency_stop_rehearsed: false
