# Crypto sleeve (SPEC.md Section 3.1). See config/sleeve.py for the
# research/live/sandbox listing model.
#
# Universe: BTC and ETH are required. Add others only once they're
# confirmed available on BOTH the Binance Spot Testnet and Kraken.
name: crypto
asset_class: crypto
decision_bar: 4h
base_currency: USD # USDT is treated as USD; see docs/api-notes.md
paper_capital: 10000
periods_per_year_days: 365 # crypto trades every calendar day
buffer_pct: 0.10
bar_close_delay_seconds: 30
regime_benchmark: BTC

assets:
  - id: BTC
    # Binance's public bulk dumps: the only free source back to 2019.
    research: { venue: binance, symbol: BTCUSDT, base_currency: BTC, quote_currency: USDT }
    # Kraken: sim prices + the live venue (MiCA-licensed; Section 3.3).
    # Dash, not slash: Parquet partition dirs can't contain "/".
    live: { venue: kraken, symbol: BTC-USD, base_currency: BTC, quote_currency: USD }
    # Binance Spot Testnet: plumbing only, synthetic prices.
    sandbox: { venue: binance_testnet, symbol: BTCUSDT, base_currency: BTC, quote_currency: USDT }
    costs:
      fee_pct: "0.0080" # Kraken entry-tier taker, verified Phase 2 (docs/api-notes.md)
      spread_bps: "2"
      slippage_k: "0.1"
  - id: ETH
    research: { venue: binance, symbol: ETHUSDT, base_currency: ETH, quote_currency: USDT }
    live: { venue: kraken, symbol: ETH-USD, base_currency: ETH, quote_currency: USD }
    sandbox: { venue: binance_testnet, symbol: ETHUSDT, base_currency: ETH, quote_currency: USDT }
    costs:
      fee_pct: "0.0080"
      spread_bps: "3"
      slippage_k: "0.1"

risk:
  per_instrument_weight_cap: 0.60
  max_order_notional_pct: 0.30
  price_band_pct: 0.02
  daily_loss_limit_pct: 0.03 # spec default; see docs/progress.md Phase 2 note on how often this trips
  drawdown_limit_pct: 0.20

strategies:
  - name: trend_vol_target
    weight: 1.0
