# Host Nginx server block for the public dashboard (SPEC Sections 8.2, 10).
# Installed on the VPS 2026-11-20 (approved). To (re)install:
#
# 1. DNS: an A record for bot.alexeymagay.com pointing at this server,
#    "DNS only" (grey cloud) in Cloudflare like the other subdomains, so
#    certbot's HTTP-01 challenge and client IPs reach Nginx directly.
# 2. cp deploy/nginx/kestrel.conf /etc/nginx/sites-available/kestrel
#    ln -s /etc/nginx/sites-available/kestrel /etc/nginx/sites-enabled/kestrel
#    nginx -t && systemctl reload nginx
# 3. TLS via the existing certbot setup:
#    certbot --nginx -d bot.alexeymagay.com
#    (certbot adds the 443 server block and the http -> https redirect.)
#
# Only the PUBLIC app (127.0.0.1:8710) is proxied. The admin app
# (127.0.0.1:8711) is never reachable from here; see ADR 0006.

limit_req_zone $binary_remote_addr zone=kestrel_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bot.alexeymagay.com;

    # Belt and braces: the public app has no admin routes at all.
    location /admin { return 404; }

    # Server-sent events: no buffering, long read timeout.
    location = /api/stream {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=kestrel_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The dashboard (static files served by the API container).
    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
