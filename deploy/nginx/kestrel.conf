# Host Nginx server block for the public dashboard (SPEC Sections 8.2, 10;
# hardening: docs/adr/0008-public-dashboard-hardening.md).
#
# This is the complete file as installed on the VPS, certbot's TLS lines
# included (they only name certificate paths). To (re)install:
#
# 1. DNS: an A record for bot.alexeymagay.com pointing at this server,
#    "DNS only" (grey cloud) in Cloudflare like the other subdomains, so
#    certbot's HTTP-01 challenge and client IPs reach Nginx directly.
# 2. First install only (no certificate yet): comment out the four ssl_*
#    / include lines and the 443 listens, install, then run
#    `certbot --nginx -d bot.alexeymagay.com` and diff against this file.
# 3. cp deploy/nginx/kestrel.conf /etc/nginx/sites-available/kestrel
#    ln -sf /etc/nginx/sites-available/kestrel /etc/nginx/sites-enabled/kestrel
#    nginx -t && systemctl reload nginx
#
# Only the PUBLIC app (127.0.0.1:8710) is proxied. The admin app
# (127.0.0.1:8711) is never reachable from here; see ADR 0006.
# Everything below applies to this server name only; the box's other
# sites are untouched.

limit_req_zone $binary_remote_addr zone=kestrel_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=kestrel_web:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=kestrel_conn:10m;

server {
    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bot.alexeymagay.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bot.alexeymagay.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    server_name bot.alexeymagay.com;
    server_tokens off;

    # Read-only site: nothing but GET/HEAD, no request bodies, and short
    # header/body timeouts against slow-client connection hogging.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    limit_conn kestrel_conn 30;
    limit_req_status 429;
    limit_conn_status 429;

    # Inherited by every location below (none sets its own add_header).
    # CSP: scripts only from this origin; styles/fonts also from Google
    # Fonts; no framing, no plugins, no form posts, no <base> rewriting.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    # Belt and braces: the public app has no admin routes and no docs.
    location /admin { return 404; }
    location ~ ^/api/(docs|openapi\.json|redoc) { return 404; }

    # Server-sent events: no buffering, long read timeout, few per client.
    location = /api/stream {
        limit_conn kestrel_conn 3;
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=kestrel_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The dashboard (static files served by the API container).
    location / {
        limit_req zone=kestrel_web burst=60 nodelay;
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    if ($host = bot.alexeymagay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name bot.alexeymagay.com;
    server_tokens off;
    return 404; # managed by Certbot
}
